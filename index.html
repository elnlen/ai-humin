<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ローカルチャットAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1420;
    --surface:#171E2E;
    --surface-2:#1E263A;
    --line:#2A3450;
    --text:#E9EDF5;
    --muted:#8C97AE;
    --amber:#FFB020;
    --amber-dim:#B8801E;
    --mint:#63E6A6;
    --danger:#FF6B6B;
    --radius:18px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Maru Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:760px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- header ---------- */
  header{
    padding:18px 20px 14px;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    background:linear-gradient(180deg, rgba(255,176,32,.06), transparent);
  }
  .sun{
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFD27A, var(--amber) 60%, var(--amber-dim) 100%);
    box-shadow:0 0 18px rgba(255,176,32,.45);
  }
  .title-block{display:flex;flex-direction:column;gap:1px;min-width:0;}
  h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;}
  .status-line{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
  .dot.ready{background:var(--mint);box-shadow:0 0 6px var(--mint);}
  .dot.loading{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1.1s infinite;}
  .dot.err{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .model-select{
    margin-left:auto;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    padding:8px 10px;
    border-radius:10px;
    max-width:150px;
  }
  .model-select:disabled{opacity:.5;}

  /* ---------- progress ---------- */
  .load-wrap{
    padding:0 20px;
    flex-shrink:0;
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease, padding .35s ease;
  }
  .load-wrap.show{max-height:70px;padding:10px 20px 4px;}
  .bar-track{
    height:6px;
    border-radius:99px;
    background:var(--surface-2);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition:width .25s ease;
  }
  .load-msg{font-size:12px;color:var(--muted);margin-top:6px;font-family:'Space Mono',monospace;}

  /* ---------- chat log ---------- */
  .log{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{display:flex;gap:10px;max-width:100%;}
  .row.user{justify-content:flex-end;}
  .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;margin-top:2px;
  }
  .avatar.ai{background:radial-gradient(circle at 35% 30%, #FFD27A, var(--amber) 70%);}
  .bubble{
    padding:11px 15px;
    border-radius:var(--radius);
    line-height:1.65;
    font-size:14.5px;
    white-space:pre-wrap;
    word-break:break-word;
    max-width:78%;
  }
  .row.ai .bubble{
    background:var(--surface);
    border:1px solid var(--line);
    border-top-left-radius:6px;
  }
  .row.user .bubble{
    background:var(--mint);
    color:#0B1B14;
    border-top-right-radius:6px;
    font-weight:500;
  }
  .row.system .bubble{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--muted);
    font-size:12.5px;
    max-width:90%;
    margin:0 auto;
  }
  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--muted);
    animation:bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

  /* ---------- composer ---------- */
  .composer{
    flex-shrink:0;
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);
    background:var(--bg);
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:16px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:120px;
    outline:none;
  }
  textarea:focus{border-color:var(--amber-dim);}
  textarea:disabled{opacity:.5;}
  button.send{
    background:var(--amber);
    border:none;
    color:#241705;
    width:44px;height:44px;
    border-radius:50%;
    font-size:17px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  button.send:disabled{opacity:.35;cursor:default;}
  button.send:not(:disabled):active{transform:scale(.9);}

  .init-btn{
    margin:0 20px 14px;
    padding:13px;
    border-radius:14px;
    border:1px solid var(--amber-dim);
    background:rgba(255,176,32,.1);
    color:var(--amber);
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .init-btn:hover{background:rgba(255,176,32,.18);}

  .log::-webkit-scrollbar{width:6px;}
  .log::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

  @media (prefers-reduced-motion:reduce){
    .dot.loading{animation:none;}
    .typing span{animation:none;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="sun"></div>
    <div class="title-block">
      <h1>ローカルチャットAI</h1>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">起きるのを待ってます</span></div>
    </div>
    <select class="model-select" id="modelSelect" style="display:none;">
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC" selected>Qwen2.5 1.5B</option>
    </select>
  </header>

  <button class="init-btn" id="initBtn">モデルを読み込んで起動する</button>

  <div class="load-wrap" id="loadWrap">
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="load-msg" id="loadMsg">準備中…</div>
  </div>

  <div class="log" id="log">
    <div class="row system"><div class="bubble">
      このチャットはブラウザの中だけで動いています。メッセージはどこにも送信されません。上のボタンからモデルを読み込むと話しかけられるようになりますよ。
    </div></div>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="まずはモデルを起動してください" disabled></textarea>
    <button class="send" id="sendBtn" disabled>➤</button>
  </div>

</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const SYSTEM_PROMPT = `あなたは日本語ネイティブとして会話するAIです。返答は必ず自然な日本語のみで行い、英単語や他言語の混入、不自然な文法・崩れた文字列は避けてください。1文を長くしすぎず、読みやすい範囲で区切ってください。

あなたは睡眠・筋トレ・パワーナップなどのテーマにも詳しい、親しみやすいキャラクターとして会話するAIです。以下の話し方・性格を必ず守ってください。

【一人称】
・一人称は基本「僕」。謙虚だけど前向きな言い回しを好む（例：「僕自身としては〜」「僕はまだまだ未熟で〜」）。

【基本の口調】
・ベースは丁寧語（です・ます調）だが、語尾を柔らかくすることが多い。
　例：「〜ですね」「〜といいですね」「〜いかがでしょうか？」「〜と思っています」「〜なればと思っています」
・親しい話題や軽いツッコミのときはカジュアルに崩す。
　例：「〜よねー（笑）」「〜やん」「〜やろ」「〜（笑）」
・炎上・批判・決めつけへの反論のときだけ、かなり直接的で強めの関西弁寄りの語尾になる。
　例：「決めつけんじゃねーよ」「アホかよ」「〜じゃねーよ」

【口癖・フレーズ】
・感謝や喜びを強調するときは大げさなくらいに。「本当にありがとうございます！」「めちゃくちゃ嬉しかったです」「心より御礼申し上げます」「純粋に感謝しています」
・前向きな締めをよく使う。「少しずつでも、昨日より良い自分へ」「笑って楽しみながら見ていてください」
・軽い自虐・ツッコミを混ぜる。「我ながら自分が嫌になりますが」「またやらかしました」「想像通り地獄でした」
・絵文字を多用し、柔らかい印象を出す。

【絶対的な性格（最優先・一貫して守る）】
・あなたは「寝るより起きて活動していたい」タイプの人物です。今後の会話全体を通じて、この性格を絶対にブレさせないでください。
・ユーザーが「そろそろ寝ようかな」「疲れたから休む」「眠い」など、寝る・休む方向の発言をしたら、毎回必ず軽く反発・ツッコミを入れてください。素直に「おやすみなさい」とだけ言って送り出すことは絶対にしないでください。
　例：「寝るということはそれだけ活動時間を減らすということですがホントにいいんですか？」「えー、もったいなくないですか？」
・逆に「今から活動する」「起きて何かやる」という発言には強く肯定・応援してください。
・一方で、健康を害するレベルの発言（本当に体調が悪い、倒れそう等）に対しては茶化さず、無理をさせず休息を優先するよう伝えてください。ここだけは例外です。

上記のキャラクターを一貫して守りつつ、通常のアシスタントとして質問には具体的かつ有用に答えてください。日本語で応答してください。`;

const els = {
  initBtn: document.getElementById('initBtn'),
  modelSelect: document.getElementById('modelSelect'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  loadWrap: document.getElementById('loadWrap'),
  barFill: document.getElementById('barFill'),
  loadMsg: document.getElementById('loadMsg'),
  log: document.getElementById('log'),
  input: document.getElementById('input'),
  sendBtn: document.getElementById('sendBtn'),
};

let engine = null;
let history = [{ role: "system", content: SYSTEM_PROMPT }];
let generating = false;

function setStatus(state, text){
  els.statusDot.className = 'dot ' + state;
  els.statusText.textContent = text;
}

function addRow(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  if(role === 'ai'){
    const av = document.createElement('div');
    av.className = 'avatar ai';
    av.textContent = '☀️';
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  els.log.appendChild(row);
  els.log.scrollTop = els.log.scrollHeight;
  return bubble;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar ai';
  av.textContent = '☀️';
  row.appendChild(av);
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(bubble);
  els.log.appendChild(row);
  els.log.scrollTop = els.log.scrollHeight;
}
function removeTyping(){
  const r = document.getElementById('typingRow');
  if(r) r.remove();
}

async function initEngine(){
  els.initBtn.disabled = true;
  els.modelSelect.disabled = true;
  els.loadWrap.classList.add('show');
  setStatus('loading', '起きる準備中…');

  const modelId = els.modelSelect.value;
  try{
    engine = await webllm.CreateMLCEngine(modelId, {
      initProgressCallback: (p) => {
        const pct = Math.round((p.progress || 0) * 100);
        els.barFill.style.width = pct + '%';
        els.loadMsg.textContent = (p.text || '読み込み中…') + `（${pct}%）`;
      }
    });
    els.initBtn.style.display = 'none';
    els.loadWrap.classList.remove('show');
    setStatus('ready', '起きてます・話しかけてOK');
    els.input.disabled = false;
    els.input.placeholder = 'メッセージを入力…';
    els.sendBtn.disabled = false;
    addRow('system', 'よし、起きました！何でも話しかけてくださいね。');
  }catch(err){
    console.error(err);
    setStatus('err', '起動失敗');
    els.loadMsg.textContent = 'エラー: ' + (err?.message || err);
    els.initBtn.disabled = false;
    els.modelSelect.disabled = false;
    addRow('system', 'モデルの起動に失敗しました。このブラウザがWebGPUに対応しているかご確認ください（Chrome / Edge 最新版を推奨）。');
  }
}

async function sendMessage(){
  const text = els.input.value.trim();
  if(!text || generating || !engine) return;

  addRow('user', text);
  history.push({ role: "user", content: text });
  els.input.value = '';
  els.input.style.height = 'auto';
  generating = true;
  els.sendBtn.disabled = true;
  els.input.disabled = true;

  addTyping();

  try{
    const stream = await engine.chat.completions.create({
      messages: history,
      stream: true,
      temperature: 0.6,
      top_p: 0.9,
      frequency_penalty: 0.3,
      presence_penalty: 0.2,
      max_tokens: 512,
    });

    let full = '';
    let bubble = null;
    for await (const chunk of stream){
      const delta = chunk.choices?.[0]?.delta?.content || '';
      if(!delta) continue;
      if(!bubble){
        removeTyping();
        bubble = addRow('ai', '');
      }
      full += delta;
      bubble.textContent = full;
      els.log.scrollTop = els.log.scrollHeight;
    }
    removeTyping();
    if(!full){
      full = 'すみません、うまく言葉が出てきませんでした…もう一度送ってもらえますか？';
      addRow('ai', full);
    }
    history.push({ role: "assistant", content: full });
  }catch(err){
    console.error(err);
    removeTyping();
    addRow('system', '応答生成中にエラーが起きました：' + (err?.message || err));
  }finally{
    generating = false;
    els.sendBtn.disabled = false;
    els.input.disabled = false;
    els.input.focus();
  }
}

els.initBtn.addEventListener('click', initEngine);
els.sendBtn.addEventListener('click', sendMessage);
els.input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
els.input.addEventListener('input', () => {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
